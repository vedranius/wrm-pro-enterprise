name: OpenSSF Scorecard

# Rates the repository's security practices (branch protection, pinned dependencies,
# token permissions, signed releases, ...). Results: Security → Code scanning and
# https://scorecard.dev/viewer/?uri=github.com/vedranius/web-browser-RDM-public

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
